[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "public"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/import/charge-sheet"
  to = "/.netlify/functions/import-charge-sheet"
  status = 200

[[redirects]]
  from = "/api/import/personality"
  to = "/.netlify/functions/import-personality"
  status = 200

[[redirects]]
  from = "/api/import/tribunal-package"
  to = "/.netlify/functions/import-tribunal-package"
  status = 200

[[redirects]]
  from = "/api/cases/:id"
  to = "/.netlify/functions/case-by-id?id=:id"
  status = 200

[[redirects]]
  from = "/api/cases"
  to = "/.netlify/functions/cases"
  status = 200

[[redirects]]
  from = "/api/runs/:id"
  to = "/.netlify/functions/run-by-id?id=:id"
  status = 200

[[redirects]]
  from = "/api/runs"
  to = "/.netlify/functions/runs"
  status = 200

[[redirects]]
  from = "/api/preflight"
  to = "/.netlify/functions/preflight"
  status = 200

[[redirects]]
  from = "/api/models"
  to = "/.netlify/functions/models"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

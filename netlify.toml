[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # Milestone 7A deployment-packaging correction: pdfjs-dist is
  # referenced only via a dynamic import() INSIDE AN EVAL'D
  # node:worker_threads Worker source string
  # (netlify/server/extraction/inputPipeline.ts's PDF_WORKER_SOURCE) --
  # esbuild's static dependency tracing cannot discover a require/import
  # written inside a string literal, so without this explicit directive
  # pdfjs-dist could be silently omitted from the deployed Function
  # artifact even though it resolves correctly in local dev. Per
  # Netlify's documented Functions packaging contract
  # (https://docs.netlify.com/build/functions/optional-configuration/),
  # `external_node_modules` copies the named package's real
  # node_modules contents into the bundled artifact unmodified, and is
  # only honored when node_bundler is explicitly "esbuild". Both keys
  # are documented ONLY at this global [functions] table level (no
  # per-function scoping is offered for them) -- this table configures
  # Netlify Functions packaging only and has no effect on the separate
  # Vite client build (`npm run build` above / `dist/`), so pdfjs-dist
  # still never reaches the browser bundle (verified by
  # scripts/verify-client-bundle.mjs).
  #
  # Verified against the REAL packaging engine, not merely assumed:
  # `netlify functions:build` (the CLI's own local-build subcommand)
  # was tried first and did NOT apply this directive -- the resulting
  # artifact had zero node_modules/pdfjs-dist despite the config being
  # read correctly (confirmed via --debug). @netlify/zip-it-and-ship-it
  # -- the actual packaging library `netlify build`/`netlify deploy`
  # call internally, invoked directly with the equivalent config this
  # netlify.toml table translates to -- DOES correctly copy the full
  # pdfjs-dist@6.2.108 package (including legacy/build/pdf.mjs, the
  # exact file the worker imports) into every setup-extractions*
  # Function's own node_modules. A real Node worker_threads Worker,
  # using this exact `require("node:worker_threads")` +
  # `await import("pdfjs-dist/legacy/build/pdf.mjs")` pattern, run with
  # its CWD inside that isolated packaged directory (no ancestor
  # node_modules reachable), successfully resolved and loaded it. See
  # PR #16 / Issue #15 for the recorded evidence and exact commands.
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "public"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/import/charge-sheet"
  to = "/.netlify/functions/import-charge-sheet"
  status = 200

[[redirects]]
  from = "/api/import/personality"
  to = "/.netlify/functions/import-personality"
  status = 200

[[redirects]]
  from = "/api/import/tribunal-package"
  to = "/.netlify/functions/import-tribunal-package"
  status = 200

# Milestone 15 (M15 production routing correction) -- Netlify's own
# documented redirect contract: a path placeholder ("A placeholder either
# matches a path segment from one `/` to the next `/`... but excluding a
# query string" -- https://docs.netlify.com/manage/routing/redirects/
# redirect-options/) is never substituted into a rewrite target's QUERY
# STRING. The previous `to = ".../case-runs?id=:id"` shape relied on
# exactly that unsupported behavior -- confirmed broken live in
# production (GET /api/cases/<uuid>/runs returned 400 "must be a valid
# UUID" through this friendly route, while the identical request against
# the underlying Function's own `?id=<uuid>` query parameter succeeded).
# The corrected rewrite carries no query string at all; the Function
# itself now extracts the dynamic id from the original request path
# (netlify/server/routing.ts's resolveRouteId), which every status = 200
# rewrite/proxy rule preserves.
[[redirects]]
  from = "/api/cases/:id/runs"
  to = "/.netlify/functions/case-runs"
  status = 200

[[redirects]]
  from = "/api/cases/:id"
  to = "/.netlify/functions/case-by-id"
  status = 200

[[redirects]]
  from = "/api/cases"
  to = "/.netlify/functions/cases"
  status = 200

# Milestone 15 (M15 production routing correction) -- see the identical
# correction/rationale above the /api/cases/:id rule.
[[redirects]]
  from = "/api/runs/:id"
  to = "/.netlify/functions/run-by-id"
  status = 200

[[redirects]]
  from = "/api/runs"
  to = "/.netlify/functions/runs"
  status = 200

# Milestone 12 (human product override, PR #34) -- the dedicated,
# operator-funded, canonical-only Jon Snow demo endpoint. A separate
# Function from /api/runs, never a fallback for it (SECURITY.md
# Sec 3.1.1).
[[redirects]]
  from = "/api/demo/jon-snow/runs"
  to = "/.netlify/functions/demo-jon-snow-runs"
  status = 200

[[redirects]]
  from = "/api/preflight"
  to = "/.netlify/functions/preflight"
  status = 200

[[redirects]]
  from = "/api/models"
  to = "/.netlify/functions/models"
  status = 200

[[redirects]]
  from = "/api/setup-extractions/preflight"
  to = "/.netlify/functions/setup-extractions-preflight"
